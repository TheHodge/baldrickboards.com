<style>
:root{
  --ink:oklch(0.185 0.035 313);--ink-2:oklch(0.145 0.03 314);--ink-3:oklch(0.115 0.028 314);--ink-card:oklch(0.225 0.04 312);
  --paper:oklch(0.945 0.012 95);--paper-2:oklch(0.90 0.018 95);
  --violet:oklch(0.53 0.205 304);--violet-d:oklch(0.40 0.17 304);--violet-br:oklch(0.74 0.16 304);
  --green:oklch(0.74 0.16 304);--green-d:oklch(0.50 0.20 304);--acc:oklch(0.80 0.155 152);--acc-d:oklch(0.60 0.15 152);--gold:oklch(0.82 0.115 88);
  --bone:oklch(0.955 0.012 95);--bone-mut:oklch(0.74 0.02 300);--bone-mut2:oklch(0.60 0.025 300);

  --maxw:1280px;

}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--body);background:var(--ink);color:var(--bone);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;line-height:1.55}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px}
.annot{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:600;font-size:15px;padding:13px 22px;border-radius:3px;border:1.5px solid transparent;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease,background .2s,color .2s,border-color .2s;line-height:1}
.btn .ar{transition:transform .2s}.btn:hover .ar{transform:translateX(3px)}
.btn-solid{background:var(--violet);color:var(--bone);box-shadow:4px 4px 0 var(--violet-d)}
.btn-solid:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--violet-d)}
.btn-solid:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--violet-d)}
.btn-solid:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn-line{background:transparent;border-color:var(--line-d);color:var(--bone)}
.btn-line:hover{border-color:var(--green);color:var(--green)}
.btn-bone{background:var(--bone);color:var(--violet-d);box-shadow:4px 4px 0 oklch(0 0 0/.22)}
.btn-bone:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 oklch(0 0 0/.22)}

.brand .wm{display:flex;flex-direction:column;line-height:1.05}
.brand .wm b{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .wm i{font-style:italic;font-size:11px;color:var(--bone-mut2);margin-top:2px}
.nav-links{display:flex;align-items:center;gap:1px;margin-left:10px}
.nav-plain{font-family:var(--body);font-size:14px;color:var(--bone-mut);padding:8px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;line-height:1.2;background:none;border:none;cursor:pointer;white-space:nowrap;transition:color .18s,background .18s}
.nav-plain:hover{color:var(--bone);background:oklch(1 0 0/.05)}
.nav-plain.accent{color:var(--acc)}
.nav-sp{flex:1}
.nav-toggle{display:none;width:40px;height:40px;border-radius:5px;background:transparent;border:1px solid var(--line-d);color:var(--bone);place-items:center}
.nav-auth{display:flex;align-items:center;gap:14px}
.nav-login{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--bone-mut);padding:8px 4px;transition:color .18s}
.nav-login:hover{color:var(--bone)}
.nav-login svg{opacity:.85}
.btn-sm{padding:10px 18px;font-size:14px}
@media(max-width:1180px){.nav-links,.nav-auth{display:none}.nav-toggle{display:grid}}
.mobile-menu{display:none;position:fixed;top:70px;left:0;right:0;bottom:0;z-index:120;background:var(--ink);border-top:1px solid var(--line-d);padding:22px 0;overflow-y:auto}
body.menu-open{overflow:hidden}body.menu-open .mobile-menu{display:block}
.mm-link{display:block;font-family:var(--disp);font-weight:600;font-size:19px;color:var(--bone);padding:15px 2px;border-bottom:1px solid var(--line-d)}
.mm-actions{margin-top:22px}.mm-actions .btn{width:100%;justify-content:center}

/* FINDER STAGE */
.finder{position:relative;overflow:hidden;min-height:calc(100vh - 70px);display:flex;flex-direction:column;background:radial-gradient(130% 120% at 82% 0%,oklch(0.30 0.12 305) 0%,transparent 50%),radial-gradient(90% 90% at 8% 8%,oklch(0.27 0.10 250/.6) 0%,transparent 52%),var(--ink)}
.finder::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line-p) 1px,transparent 1px),linear-gradient(90deg,var(--line-p) 1px,transparent 1px);background-size:48px 48px;opacity:.45;pointer-events:none;mask-image:radial-gradient(80% 90% at 50% 0%,#000,transparent 78%)}
.finder-inner{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;padding:40px 32px 64px;flex:1;display:flex;flex-direction:column}
.finder-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.finder-eye{display:flex;align-items:center;gap:11px}
.finder-eye .bar{height:1px;width:28px;background:var(--green)}
.f-restart{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--bone-mut2);background:none;border:1px solid var(--line-d);border-radius:6px;padding:7px 12px;transition:.18s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.f-restart:hover{color:var(--bone);border-color:var(--green-d)}
.f-restart.hide{display:none}

/* progress */
.prog{margin-bottom:30px}
.prog-row{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-mut2);margin-bottom:10px}
.prog-bar{height:4px;border-radius:99px;background:oklch(1 0 0/.08);overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--violet-br));width:0;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* step */
.stage{flex:1}
.step{animation:stepIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes stepIn{from{transform:translateY(14px)}to{transform:none}}
.q-title{font-family:var(--disp);font-weight:800;font-size:clamp(27px,3.6vw,40px);line-height:1.08;letter-spacing:-.025em;color:var(--bone)}
.q-help{font-size:15.5px;color:var(--bone-mut);margin-top:12px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:30px}
.tiles.one{grid-template-columns:1fr 1fr}
.tile{position:relative;text-align:left;display:flex;align-items:flex-start;gap:14px;background:oklch(1 0 0/.03);border:1.5px solid var(--line-d);border-radius:13px;padding:18px 18px;color:var(--bone);transition:border-color .18s,background .18s,transform .12s}
.tile:hover{border-color:var(--violet-br);background:oklch(1 0 0/.06)}
.tile:active{transform:scale(.99)}
.tile.sel{border-color:var(--violet-br);background:oklch(0.5 0.2 304/.16);box-shadow:inset 0 0 0 1px var(--violet-br)}
.tile .ic{flex-shrink:0;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--green);background:oklch(0.5 0.2 304/.12);border:1px solid var(--line-d)}
.tile .ic svg{width:22px;height:22px}
.tile .tx b{display:block;font-family:var(--disp);font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--bone)}
.tile .tx span{display:block;font-size:13px;color:var(--bone-mut);margin-top:3px;line-height:1.45}
.tile .chk{position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-d);display:grid;place-items:center;opacity:0;transition:.18s}
.tile.sel .chk{opacity:1;background:var(--violet);border-color:var(--violet)}
.tile .chk svg{width:12px;height:12px;color:#fff}
@media(max-width:560px){.tiles,.tiles.one{grid-template-columns:1fr}}

/* slider */
.sliderbox{margin-top:34px;background:oklch(1 0 0/.03);border:1.5px solid var(--line-d);border-radius:14px;padding:30px 26px}
.slider-val{font-family:var(--disp);font-weight:800;font-size:54px;letter-spacing:-.03em;color:var(--bone);line-height:1}
.slider-val small{font-family:var(--mono);font-size:14px;font-weight:400;letter-spacing:.04em;color:var(--green);margin-left:10px;text-transform:uppercase}
.range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:oklch(1 0 0/.1);margin-top:26px;outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--violet);border:3px solid var(--bone);cursor:pointer;box-shadow:0 4px 12px oklch(0.05 0.04 305/.6)}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--violet);border:3px solid var(--bone);cursor:pointer}
.range-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--bone-mut2);margin-top:12px}

/* nav buttons */
.f-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:36px}
.f-back{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--bone-mut);background:none;border:none;display:inline-flex;align-items:center;gap:8px;padding:10px 4px;transition:color .18s}
.f-back:hover{color:var(--bone)}
.f-back.hide{visibility:hidden}

/* RESULT */
.result{animation:stepIn .45s cubic-bezier(.2,.8,.2,1)}
.result-eye{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.result-eye .bar{height:1px;width:28px;background:var(--green)}
.result h2{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.025em;color:var(--bone);line-height:1.1}
.rec-card{margin-top:26px;background:var(--paper);color:var(--ink-text);border:1.5px solid var(--ink-text);border-radius:16px;box-shadow:6px 6px 0 var(--violet);overflow:hidden;display:grid;grid-template-columns:300px 1fr}
.rec-shot{background:var(--paper-2);border-right:1.5px solid var(--ink-text);padding:18px;display:flex;align-items:center}
.rec-shot image-slot{width:100%;height:230px;display:block}
.rec-body{padding:28px 28px 30px}
.rec-cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet-d)}
.rec-body h3{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--ink-text);margin-top:8px}
.rec-spec{display:inline-flex;align-self:flex-start;white-space:nowrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet-d);background:oklch(0.55 0.2 304/.1);border:1px solid color-mix(in oklch,var(--violet) 30%,transparent);padding:4px 10px;border-radius:20px;margin-top:12px}
.rec-why{font-size:15px;line-height:1.6;color:var(--ink-mut);margin-top:16px}
.rec-btns{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.btn-ink{background:var(--violet);color:var(--bone);box-shadow:4px 4px 0 var(--violet-d)}
.btn-ink:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--violet-d)}
.btn-ghost{background:transparent;border-color:var(--ink-text);color:var(--ink-text)}
.btn-ghost:hover{background:var(--ink-text);color:var(--bone)}
@media(max-width:680px){.rec-card{grid-template-columns:1fr}.rec-shot{border-right:none;border-bottom:1.5px solid var(--ink-text)}}

.runner{margin-top:20px;display:flex;align-items:center;gap:14px;background:oklch(1 0 0/.03);border:1.5px solid var(--line-d);border-radius:12px;padding:15px 18px}
.runner .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-mut2)}
.runner b{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--bone)}
.runner span.sp{font-family:var(--mono);font-size:12px;color:var(--green)}
.runner a{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--green);border-bottom:1.5px solid color-mix(in oklch,var(--green) 35%,transparent);white-space:nowrap}
.runner a:hover{color:var(--violet-br);border-color:var(--violet-br)}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.recap .pill{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--bone-mut);background:oklch(1 0 0/.04);border:1px solid var(--line-d);border-radius:20px;padding:6px 12px}
.recap .pill b{color:var(--bone);font-weight:600}

/* FOOTER */
.footer{background:var(--ink-3);padding:54px 0 30px;border-top:1px solid var(--line-d)}
.foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot-bottom .cc{color:var(--bone-mut2);font-size:12.5px;font-family:var(--mono);letter-spacing:.02em}
.foot-flag{font-size:13px;color:var(--bone-mut);display:inline-flex;align-items:center;gap:7px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.prog-fill{transition:none}}
</style>

<script>
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
/* BEGIN USAGE */
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */
/* END USAGE */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so
      // disconnect/reconnect (e.g. React remount) doesn't stack handlers.
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      // naturalWidth/Height aren't known until load — re-apply so the cover
      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());
      // Gated on editable + fit=cover so share links and contain/fill slots
      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

</script>
<script>
(function(){
  "use strict";
  // mobile nav
  var nt=document.querySelector(".nav-toggle"),mm=document.getElementById("mobileMenu");
  if(nt&&mm){nt.addEventListener("click",function(){document.body.classList.toggle("menu-open");});
    mm.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(){document.body.classList.remove("menu-open");});});}

  var I={
    spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>',
    tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 13h5l-3 5h12l-3-5h5L12 2z"/><path d="M12 18v4"/></svg>',
    grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    touch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 8a2 2 0 0 1 4 0v4"/><path d="M17 9a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-2.5-4a2 2 0 0 1 3.4-2L9 13"/></svg>',
    plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v5"/></svg>',
    beam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M9.5 7.5 4 21M14.5 7.5 20 21M12 8v13"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
    mix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4"/><circle cx="17" cy="17" r="4"/><path d="M17 3v4M15 5h4"/></svg>',
    pixel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><path d="M3 12h.5M7 12h3M14 12h3M21 12h.5"/></svg>',
    no:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg>'
  };

  var BOARDS={
    b8:{name:'Baldrick8',cat:'Pixel Controller',spec:'8 Outputs',page:'Baldrick8 Board Page.html',slot:'rec-b8',
      blurb:'An eight-port controller that punches well above its budget price — the perfect first board, and plenty for a tree or a yard full of pixels.'},
    b17:{name:'Baldrick17',cat:'Pixel Controller',spec:'17 Outputs',page:'#',slot:'rec-b17',
      blurb:'Seventeen ports for big shows and bold ideas. When eight just won\u2019t cut it — mega-trees, matrices and whole-house displays.'},
    in8:{name:'BaldrickInput8',cat:'Interactive',spec:'8 Inputs / 2 Outputs',page:'#',slot:'rec-in8',
      blurb:'Buttons, sensors and triggers with two pixel outputs — the board for props that react to people walking past.'},
    dmx:{name:'BaldrickDMX',cat:'DMX Controller',spec:'DMX512',page:'#',slot:'rec-dmx',
      blurb:'Drive moving heads, lasers and DMX fixtures right alongside the rest of your Baldrick rig.'},
    sw:{name:'BaldrickSwitchy',cat:'Relay Controller',spec:'Mains Relays',page:'#',slot:'rec-sw',
      blurb:'Switch inflatables, floodlights and mains-powered props safely and on cue — the muscle of the line-up.'}
  };

  var STEPS=[
    {id:'build',q:'What are you building?',help:'Pick the closest match — we\u2019ll fine-tune from there.',type:'tiles',options:[
      {label:'My first display',desc:'A few props, just getting started',icon:I.spark,score:{b8:3}},
      {label:'A tree or a yard of pixels',desc:'Outlines, arches, a pixel tree',icon:I.tree,score:{b8:2,b17:1}},
      {label:'A proper mega-show',desc:'Mega-tree, matrix, whole house',icon:I.grid,score:{b17:3}},
      {label:'An interactive prop',desc:'People or sensors trigger it',icon:I.touch,score:{in8:3}},
      {label:'Mains-powered lights',desc:'Inflatables, floods, motors',icon:I.plug,score:{sw:3}},
      {label:'DMX fixtures',desc:'Moving heads, lasers, washes',icon:I.beam,score:{dmx:3}}
    ]},
    {id:'outputs',q:'Roughly how many pixel outputs?',help:'Each output drives one string or prop. Not using pixels? Just leave it and carry on.',type:'slider',min:1,max:24,def:8,unit:'outputs',
      score:function(v){return v<=8?{b8:2}:(v<=17?{b17:2}:{b17:3});}},
    {id:'react',q:'Should anything react to people?',help:'Buttons, PIR sensors, visitor triggers \u2014 anything interactive.',type:'tiles',cols:'one',options:[
      {label:'Yes — it\u2019s interactive',desc:'Buttons or sensors fire the show',icon:I.touch,score:{in8:3}},
      {label:'No — it just runs',desc:'Scheduled or always-on sequence',icon:I.no,score:{}}
    ]},
    {id:'lights',q:'What are you actually lighting?',help:'The kind of hardware on the other end of the wire.',type:'tiles',options:[
      {label:'Addressable pixels',desc:'WS2811 · SK6812 · APA102',icon:I.pixel,score:{b8:1,b17:1}},
      {label:'DMX fixtures',desc:'Moving heads, washes, lasers',icon:I.beam,score:{dmx:3}},
      {label:'Mains / relays',desc:'Inflatables, floods, mains lights',icon:I.plug,score:{sw:3}},
      {label:'A bit of everything',desc:'Mixed rig, not sure yet',icon:I.mix,score:{b17:1,dmx:1,sw:1}}
    ]}
  ];

  var KEY='bb_finder_v1';
  var state={step:0,answers:{}};
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){state=s;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var stage=document.getElementById('stage');
  var progStep=document.getElementById('progStep'),progPct=document.getElementById('progPct'),progFill=document.getElementById('progFill'),prog=document.getElementById('prog');
  var restart=document.getElementById('restart');
  restart.addEventListener('click',function(){state={step:0,answers:{}};save();render();});

  function setProgress(){
    var total=STEPS.length;
    if(state.step>=total){prog.style.display='none';return;}
    prog.style.display='';
    var n=state.step+1;
    progStep.textContent='Question '+n+' of '+total;
    var pct=Math.round((state.step)/total*100);
    progPct.textContent=pct+'%';
    progFill.style.width=pct+'%';
  }

  function tilesStep(st){
    var wrap=document.createElement('div');wrap.className='step';
    var cur=state.answers[st.id];
    wrap.innerHTML='<h2 class="q-title">'+st.q+'</h2>'+(st.help?'<p class="q-help">'+st.help+'</p>':'')+
      '<div class="tiles'+(st.cols==='one'?' one':'')+'"></div>';
    var grid=wrap.querySelector('.tiles');
    st.options.forEach(function(o,i){
      var b=document.createElement('button');b.type='button';b.className='tile'+(cur===i?' sel':'');
      b.innerHTML=(o.icon?'<span class="ic">'+o.icon+'</span>':'')+
        '<span class="tx"><b>'+o.label+'</b>'+(o.desc?'<span>'+o.desc+'</span>':'')+'</span>'+
        '<span class="chk">'+I.check+'</span>';
      b.addEventListener('click',function(){
        state.answers[st.id]=i;save();
        grid.querySelectorAll('.tile').forEach(function(t){t.classList.remove('sel');});
        b.classList.add('sel');
        var nx=wrap.querySelector('#fnext');if(nx)nx.disabled=false;
      });
      grid.appendChild(b);
    });
    wrap.appendChild(navRow(cur!=null));
    return wrap;
  }

  function sliderStep(st){
    var wrap=document.createElement('div');wrap.className='step';
    var val=state.answers[st.id]!=null?state.answers[st.id]:st.def;
    wrap.innerHTML='<h2 class="q-title">'+st.q+'</h2>'+(st.help?'<p class="q-help">'+st.help+'</p>':'')+
      '<div class="sliderbox"><div class="slider-val"><span id="sv">'+val+'</span>'+(val>=st.max?'+':'')+'<small>'+st.unit+'</small></div>'+
      '<input class="range" type="range" min="'+st.min+'" max="'+st.max+'" value="'+val+'" id="rng">'+
      '<div class="range-ticks"><span>'+st.min+'</span><span>8</span><span>17</span><span>'+st.max+'+</span></div></div>';
    var rng=wrap.querySelector('#rng'),sv=wrap.querySelector('#sv');
    rng.addEventListener('input',function(){var v=parseInt(rng.value,10);sv.textContent=v;sv.nextSibling.textContent=(v>=st.max?'+':'');state.answers[st.id]=v;save();});
    if(state.answers[st.id]==null){state.answers[st.id]=val;save();}
    wrap.appendChild(navRow(true));
    return wrap;
  }

  function navRow(canNext){
    var row=document.createElement('div');row.className='f-nav';
    var back=document.createElement('button');back.type='button';back.className='f-back'+(state.step===0?' hide':'');
    back.innerHTML='<span class="ar" style="transform:rotate(180deg)">→</span> Back';
    back.addEventListener('click',function(){if(state.step>0){state.step--;save();render();}});
    var next=document.createElement('button');next.type='button';next.id='fnext';next.className='btn btn-solid';
    next.disabled=!canNext;
    next.innerHTML=(state.step===STEPS.length-1?'See my board':'Next')+' <span class="ar">→</span>';
    next.addEventListener('click',function(){state.step++;save();render();});
    row.appendChild(back);row.appendChild(next);
    return row;
  }

  function computeScores(){
    var sc={};
    STEPS.forEach(function(st){
      var a=state.answers[st.id];if(a==null)return;
      var add=st.type==='slider'?st.score(a):st.options[a].score;
      for(var k in add)sc[k]=(sc[k]||0)+add[k];
    });
    return sc;
  }

  function rankedBoards(){
    var sc=computeScores();
    var ids=Object.keys(BOARDS);
    ids.sort(function(a,b){return (sc[b]||0)-(sc[a]||0);});
    if(!ids.some(function(i){return sc[i];}))return ['b8','b17'];
    return ids;
  }

  function whyText(winner){
    var a=state.answers;
    function lc(s){return (s.length>1&&s[1]===s[1].toLowerCase())?s[0].toLowerCase()+s.slice(1):s;}
    var build=a.build!=null?lc(STEPS[0].options[a.build].label).replace(/^my /,'your '):null;
    var bits=[];
    if(build)bits.push('you\u2019re building '+build);
    if(a.outputs!=null&&(winner==='b8'||winner==='b17'))bits.push('around '+a.outputs+' pixel output'+(a.outputs===1?'':'s'));
    if(a.react===0)bits.push('interactive triggers');
    var lead=bits.length?('Because '+bits.join(', ')+', '):'';
    return lead+'the '+BOARDS[winner].name+' is the cunning choice.';
  }

  function recapPills(){
    var a=state.answers,out='';
    if(a.build!=null)out+='<span class="pill"><b>Build:</b> '+STEPS[0].options[a.build].label+'</span>';
    if(a.outputs!=null)out+='<span class="pill"><b>Outputs:</b> ~'+a.outputs+'</span>';
    if(a.react!=null)out+='<span class="pill"><b>Interactive:</b> '+(a.react===0?'Yes':'No')+'</span>';
    if(a.lights!=null)out+='<span class="pill"><b>Lights:</b> '+STEPS[3].options[a.lights].label+'</span>';
    return out;
  }

  function renderResult(){
    prog.style.display='none';
    restart.classList.remove('hide');
    var rank=rankedBoards();
    var win=BOARDS[rank[0]],run=BOARDS[rank[1]];
    var el=document.createElement('div');el.className='result';
    el.innerHTML=
      '<div class="result-eye"><span class="bar"></span><span class="annot">Your match</span></div>'+
      '<h2>We\u2019d reach for the '+win.name+'.</h2>'+
      '<div class="rec-card">'+
        '<div class="rec-shot"><image-slot id="'+win.slot+'" placeholder="'+win.name+' board photo"></image-slot></div>'+
        '<div class="rec-body">'+
          '<div class="rec-cat">'+win.cat+'</div>'+
          '<h3>'+win.name+'</h3>'+
          '<div class="rec-spec">'+win.spec+'</div>'+
          '<p class="rec-why">'+whyText(rank[0])+' '+win.blurb+'</p>'+
          '<div class="rec-btns"><a class="btn btn-ink" href="'+win.page+'">Learn more <span class="ar">\u2192</span></a>'+
          '<a class="btn btn-ghost" href="#">Where to buy</a></div>'+
        '</div>'+
      '</div>'+
      '<div class="runner"><span class="lbl">Also worth a look</span><b>'+run.name+'</b><span class="sp">'+run.spec+'</span><a href="'+run.page+'">Compare \u2192</a></div>'+
      '<div class="recap">'+recapPills()+'</div>';
    stage.innerHTML='';stage.appendChild(el);
  }

  function render(){
    setProgress();
    if(state.step>=STEPS.length){renderResult();return;}
    restart.classList.toggle('hide',state.step===0&&state.answers.build==null);
    var st=STEPS[state.step];
    var node=st.type==='slider'?sliderStep(st):tilesStep(st);
    stage.innerHTML='';stage.appendChild(node);
  }

  if(state.step>STEPS.length)state.step=STEPS.length;
  render();
})();
</script>
