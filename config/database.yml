# PostgreSQL. Versions 9.3 and up are supported.
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: baldrickboards_development
  username: <%= ENV.fetch("DATABASE_USERNAME", "heatherhodgson") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: baldrickboards_test
  username: <%= ENV.fetch("DATABASE_USERNAME", "heatherhodgson") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: baldrickboards_production
    username: <%= ENV.fetch("DATABASE_USERNAME", "heatherhodgson") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  cache:
    <<: *default
    database: baldrickboards_production_cache
    username: <%= ENV.fetch("DATABASE_USERNAME", "heatherhodgson") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: baldrickboards_production_queue
    username: <%= ENV.fetch("DATABASE_USERNAME", "heatherhodgson") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    migrations_paths: db/queue_migrate
